<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine App - Reserva de Películas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎬 Cine App</h1>
            <p class="subtitle">Reserva tus películas favoritas</p>
        </header>

        <main class="main-content">
            <!-- Sección de Catálogo de Películas -->
            <section class="movies-section">
                <h2>Películas Disponibles</h2>
                <div class="movies-grid" id="moviesGrid"></div>
            </section>

            <!-- Sección de Selección de Horario (oculta por defecto) -->
            <section class="schedule-section" id="scheduleSection">
                <h2>Selecciona un Horario</h2>
                <div class="selected-movie-info" id="selectedMovieInfo"></div>
                <div class="schedule-buttons" id="scheduleButtons"></div>

                <!-- Sección de Entradas y Confirmación -->
                <div class="booking-section">
                    <h3>Cantidad de Entradas</h3>
                    <div class="ticket-selector">
                        <button class="btn-minus" id="btnMinus">−</button>
                        <span class="ticket-count" id="ticketCount">1</span>
                        <button class="btn-plus" id="btnPlus">+</button>
                    </div>

                    <div class="price-info">
                        <div class="price-row">
                            <span>Precio por entrada:</span>
                            <span class="price-value">$3.500</span>
                        </div>
                        <div class="price-row total">
                            <span>Total:</span>
                            <span class="price-value" id="totalPrice">$3.500</span>
                        </div>
                    </div>

                    <button class="btn-confirm" id="btnConfirm" disabled>Confirmar Reserva</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal de Éxito -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✓ Reserva Confirmada</h2>
            </div>
            <div class="modal-body">
                <div class="confirmation-detail">
                    <div class="detail-label">Película:</div>
                    <div class="detail-value" id="modalMovie"></div>
                </div>
                <div class="confirmation-detail">
                    <div class="detail-label">Horario:</div>
                    <div class="detail-value" id="modalSchedule"></div>
                </div>
                <div class="confirmation-detail">
                    <div class="detail-label">Entradas:</div>
                    <div class="detail-value" id="modalTickets"></div>
                </div>
                <div class="confirmation-detail highlight">
                    <div class="detail-label">Precio Total:</div>
                    <div class="detail-value" id="modalTotal"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-new-booking" id="btnNewBooking">Hacer otra reserva</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
